stages:
  - test
  - test-coverage
  - build
  - deploy

unit_tests:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  image:
    name: python:3.13
  variables:
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
    POETRY_HOME: "$CI_PROJECT_DIR/.cache/poetry"
  cache:
    key: $CI_COMMIT_REF_NAME
    paths:
      - $PRE_COMMIT_HOME
      - $POETRY_HOME
      - .venv
  before_script:
    - python3 -m venv $POETRY_HOME
    - $POETRY_HOME/bin/pip install poetry==2.3.2
    - export PATH="$PATH:$POETRY_HOME/bin"
    - poetry config virtualenvs.in-project true
    - poetry sync --with test,dev
  script:
    - poetry run pytest -x --ignore test/core/ --cov --cov-report term --cov-report xml:coverage.xml
    - poetry run pytest -x test/core/
    - poetry run pre-commit run --all-files
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml

test_coverage_threshold:
  stage: test-coverage
  dependencies:
    - unit_tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  image:
    name: python:3.13
  before_script:
    - apt-get update && apt-get install -y bc
  script:
    - coverage="$(grep -oP '<coverage[^>]+line-rate="\K[0-9.]+' "coverage.xml")"
    - |
      if (( $(echo "$coverage < 0.8" | bc -l) )); then
        echo "Code coverage is only $(echo "$coverage*100" | bc)%. We recommend a minimum of 80%." && exit 1;
      else
        exit 0;
      fi
  allow_failure:
    exit_codes:
      - 1

optional_linting:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  image:
    name: python:3.13
  variables:
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
  cache:
    key: $CI_COMMIT_REF_NAME
    paths:
      - $PRE_COMMIT_HOME
      - .venv
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install pre-commit
  script:
    - pre-commit run -c .pre-commit-config-optional-linting.yaml --all-files
  allow_failure:
    exit_codes:
      - 1

build_staging:
  stage: build
  tags: [ buildah ]
  variables:
        KUBERNETES_CPU_REQUEST: '1'
        KUBERNETES_CPU_LIMIT: '2'
        KUBERNETES_MEMORY_REQUEST: '2Gi'
        KUBERNETES_MEMORY_LIMIT: '4Gi'
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  before_script:
    - export REGISTRY_AUTH_FILE="$(mktemp -d)/auth.json"
    - echo "$CI_DOCKER_TOKEN" | buildah login -u "$CI_DOCKER_USER" --password-stdin "$REGISTRY_URL"
  script:
    - |
        buildah build \
          --layers \
          --cache-from=${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}-buildcache \
          --cache-to=${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}-buildcache \
          --tag ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:staging \
          --tag ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:devel \
          .
    - buildah push ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:staging
    - buildah push ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:devel
  after_script:
    - buildah logout --all || true


build_release:
    stage: build
    tags: [buildah]
    rules:
        - if: $CI_COMMIT_TAG
    variables:
        KUBERNETES_CPU_REQUEST: '1'
        KUBERNETES_CPU_LIMIT: '2'
        KUBERNETES_MEMORY_REQUEST: '2Gi'
        KUBERNETES_MEMORY_LIMIT: '4Gi'
    before_script:
        - export REGISTRY_AUTH_FILE="$(mktemp -d)/auth.json"
        - echo "$CI_DOCKER_TOKEN" | buildah login -u "$CI_DOCKER_USER" --password-stdin "$REGISTRY_URL"
    script:
        - |
            buildah build \
                --layers \
                --tag ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG} \
                .
        - buildah push ${REGISTRY_URL}/${GROUP_NAME}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG}
    after_script:
        - buildah logout --all || true


deploy_staging:
  stage: deploy
  tags: [ k8s-kta ]
  needs:
    - build_staging
  rules:
    - !reference [ build_staging, rules ]
  image: repo.heigit.org/heigit/argocd-cli:latest
  script:
    - |
      argocd app actions \
        run ca-staging/${ARGOCD_STAGING_APPLICATION_NAME} \
        restart --kind Deployment \
        --server ${ARGOCD_SERVER} \
        --auth-token ${ARGOCD_AUTH_TOKEN}\
        --resource-name can-${CI_PROJECT_NAME}
